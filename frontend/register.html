<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — SupportAI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-page">
  <div style="width:100%;max-width:420px">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="white" fill-opacity=".2"/>
          <path d="M8 10h16v2H8zM8 15h12v2H8zM8 20h10v2H8z" fill="white"/>
          <circle cx="24" cy="21" r="5" fill="#10b981"/>
          <path d="M22 21l1.5 1.5L26 19" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Create your account</h1>
      <p>Get started with SupportAI</p>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <form id="register-form">

        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Jane Smith" required minlength="2" />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6" />
            <button type="button" id="toggle-pw" class="toggle-pw" title="Show/hide password">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Account type</label>
          <select id="role">
            <option value="customer">Customer — submit support tickets</option>
            <option value="agent">Agent — handle and reply to tickets</option>
            <option value="admin">Admin — full system access</option>
          </select>
        </div>

        <button type="submit" class="btn btn--primary btn--full" style="margin-top:8px">
          Create account
        </button>

      </form>

      <p class="text-center text-sm mt-4" style="color:#64748b">
        Already have an account?
        <a href="login.html">Sign in</a>
      </p>
    </div>

  </div>
</div>

<script src="js/script.js"></script>
<script>initRegister();</script>
</body>
</html>
