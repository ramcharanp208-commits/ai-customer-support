<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Ticket — SupportAI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar" id="navbar"></nav>

<main style="padding:32px 0">
  <div class="container" style="max-width:640px">

    <!-- Back -->
    <button class="back-link" onclick="history.back()">← Back</button>

    <!-- Page header -->
    <div class="mb-4">
      <h1 style="font-size:1.4rem;font-weight:700">Submit a Support Request</h1>
      <p style="color:#64748b;font-size:.875rem;margin-top:4px">
        Our AI will instantly classify and prioritise your ticket.
      </p>
    </div>

    <!-- Form card -->
    <div class="card">
      <form id="ticket-form">

        <div class="form-group">
          <label for="title">Title <span style="color:red">*</span></label>
          <input
            type="text"
            id="title"
            placeholder="Brief summary of your issue"
            required
            minlength="5"
            maxlength="255"
          />
        </div>

        <div class="form-group">
          <label for="description">
            Description <span style="color:red">*</span>
          </label>
          <textarea
            id="description"
            placeholder="Describe your issue in detail. The more context you provide, the faster we can help."
            required
            minlength="10"
            rows="6"
          ></textarea>
          <p id="char-count" style="font-size:.75rem;color:#94a3b8;margin-top:4px">0 characters</p>
        </div>

        <!-- AI preview injected here -->
        <div id="ai-preview"></div>

        <!-- Buttons -->
        <div style="display:flex;gap:10px;margin-top:16px">
          <button type="button" class="btn btn--secondary" style="flex:1" onclick="history.back()">
            Cancel
          </button>
          <button type="submit" class="btn btn--primary" style="flex:1">
            Submit Ticket ✈️
          </button>
        </div>

      </form>
    </div>

  </div>
</main>

<script src="js/script.js"></script>
<script>
  initNewTicket();

  // Live character count
  document.getElementById("description").addEventListener("input", function() {
    document.getElementById("char-count").textContent = this.value.length + " characters";
  });
</script>
</body>
</html>
