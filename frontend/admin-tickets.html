<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Tickets — SupportAI Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar" id="navbar"></nav>

<main style="padding:32px 0">
  <div class="container--wide">

    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1>All Tickets</h1>
        <p><strong id="total-count">—</strong> total tickets</p>
      </div>
      <button class="btn btn--secondary" id="refresh-btn">🔄 Refresh</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="form-group" style="margin-bottom:0">
        <label>Status</label>
        <select id="f-status">
          <option value="">All</option>
          <option value="open">Open</option>
          <option value="pending">Pending</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>Priority</label>
        <select id="f-priority">
          <option value="">All</option>
          <option value="urgent">Urgent</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label>Category</label>
        <select id="f-category">
          <option value="">All</option>
          <option value="payment">Payment</option>
          <option value="billing">Billing</option>
          <option value="technical">Technical</option>
          <option value="account">Account</option>
          <option value="general">General</option>
        </select>
      </div>
      <button class="btn btn--secondary btn--sm" id="clear-filters" style="align-self:flex-end">
        ✕ Clear
      </button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Category</th>
            <th>Assign To</th>
            <th>Change Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tickets-tbody">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <span id="page-info">Page 1</span>
      <div class="pagination__btns">
        <button class="btn btn--secondary btn--sm" id="prev-btn" disabled>← Prev</button>
        <button class="btn btn--secondary btn--sm" id="next-btn">Next →</button>
      </div>
    </div>

  </div>
</main>

<script src="js/script.js"></script>
<script>initAdminTickets();</script>
</body>
</html>
